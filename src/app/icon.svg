<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>
  <!-- Acoustic guitar silhouette -->
  <g transform="translate(16,16) rotate(-30) translate(-16,-16)">
    <!-- Neck -->
    <rect x="14.5" y="2" width="3" height="14" rx="1" fill="#d4a853"/>
    <!-- Tuning pegs -->
    <circle cx="13.5" cy="3.5" r="1" fill="#d4a853"/>
    <circle cx="18.5" cy="3.5" r="1" fill="#d4a853"/>
    <circle cx="13.5" cy="6" r="1" fill="#d4a853"/>
    <circle cx="18.5" cy="6" r="1" fill="#d4a853"/>
    <!-- Body -->
    <ellipse cx="16" cy="22" rx="8" ry="8" fill="#d4a853"/>
    <!-- Sound hole -->
    <circle cx="16" cy="21" r="3" fill="#0a0a0a"/>
    <!-- Bridge detail -->
    <rect x="13" y="25" width="6" height="1" rx="0.5" fill="#0a0a0a"/>
    <!-- Strings hint -->
    <line x1="15.2" y1="8" x2="15.2" y2="25" stroke="#0a0a0a" stroke-width="0.4"/>
    <line x1="16" y1="8" x2="16" y2="25" stroke="#0a0a0a" stroke-width="0.4"/>
    <line x1="16.8" y1="8" x2="16.8" y2="25" stroke="#0a0a0a" stroke-width="0.4"/>
  </g>
</svg>
