<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <rect width="180" height="180" rx="36" fill="#0a0a0a"/>
  <g transform="translate(90,90) rotate(-30) translate(-90,-90)">
    <!-- Neck -->
    <rect x="81" y="12" width="18" height="78" rx="5" fill="#d4a853"/>
    <!-- Tuning pegs -->
    <circle cx="75" cy="20" r="5.5" fill="#d4a853"/>
    <circle cx="105" cy="20" r="5.5" fill="#d4a853"/>
    <circle cx="75" cy="34" r="5.5" fill="#d4a853"/>
    <circle cx="105" cy="34" r="5.5" fill="#d4a853"/>
    <!-- Body -->
    <ellipse cx="90" cy="124" rx="46" ry="46" fill="#d4a853"/>
    <!-- Sound hole -->
    <circle cx="90" cy="120" r="17" fill="#0a0a0a"/>
    <!-- Bridge -->
    <rect x="73" y="142" width="34" height="5" rx="2.5" fill="#0a0a0a"/>
    <!-- Strings -->
    <line x1="85.5" y1="45" x2="85.5" y2="142" stroke="#0a0a0a" stroke-width="2"/>
    <line x1="90" y1="45" x2="90" y2="142" stroke="#0a0a0a" stroke-width="2"/>
    <line x1="94.5" y1="45" x2="94.5" y2="142" stroke="#0a0a0a" stroke-width="2"/>
  </g>
</svg>
